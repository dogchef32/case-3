<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Приветствие — Django</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8efff,#f8fafc);font-family:system-ui,Arial,sans-serif;color:#17233c}.card{width:min(92vw,460px);background:#fff;padding:36px;border-radius:20px;box-shadow:0 18px 60px #2434511c}h1{margin:0 0 10px;font-size:28px}p{color:#59667b}label{display:block;font-weight:600;margin:25px 0 8px}input{width:100%;padding:13px;border:1px solid #bac5d6;border-radius:10px;font-size:16px}button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:#315ee9;color:white;font-weight:700;font-size:16px;cursor:pointer}button:hover{background:#234cc9}.result{margin-top:22px;padding:15px;border-radius:10px;background:#e7f8ed;color:#17693c}.errorlist{color:#b42318;padding-left:18px}
</style></head><body><main class="card"><h1>Добро пожаловать!</h1><p>Введите имя, чтобы получить персональное приветствие.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label for="{{ form.name.id_for_label }}">Ваше имя</label>{{ form.name.errors }}{{ form.name }}<button type="submit">Отправить</button></form>{% if greeting %}<div class="result" role="status">{{ greeting }}</div>{% endif %}</main></body></html>
